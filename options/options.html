<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarTranslate — 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #333;
      font-size: 14px;
      line-height: 1.6;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a56db;
      margin-bottom: 6px;
    }

    .header p {
      color: #888;
      font-size: 13px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    label .hint {
      font-weight: 400;
      color: #999;
      font-size: 12px;
    }

    input[type="text"],
    input[type="password"],
    input[type="url"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66,133,244,0.1);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    /* Switch */
    .switch {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc;
      border-radius: 26px;
      transition: 0.25s;
    }

    .slider::before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.25s;
    }

    input:checked + .slider {
      background: #4285f4;
    }

    input:checked + .slider::before {
      transform: translateX(22px);
    }

    .btn {
      padding: 10px 20px;
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    .btn-primary {
      background: #4285f4;
      color: white;
      border-color: #4285f4;
      font-weight: 500;
    }

    .btn-primary:hover {
      background: #3367d6;
    }

    .btn-danger {
      color: #d93025;
      border-color: #fce8e6;
      background: #fce8e6;
    }

    .btn-danger:hover {
      background: #f8d7da;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      background: #333;
      color: white;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background: #34a853;
    }

    .cache-info {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .cache-info span {
      color: #4285f4;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📖 ScholarTranslate 设置</h1>
      <p>学术论文双语翻译助手</p>
    </div>

    <!-- 基本设置 -->
    <div class="card">
      <div class="card-title">⚙️ 基本设置</div>

      <div class="toggle-row">
        <span>启用翻译</span>
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group">
        <label>默认翻译引擎</label>
        <select id="engine-select">
          <option value="google-gtx">Google 翻译（免费，无需配置）</option>
          <option value="deeplx">DeepLX（免费 DeepL 代理）</option>
          <option value="deepseek">DeepSeek AI（需要 API Key）</option>
          <option value="openai">OpenAI GPT（需要 API Key）</option>
        </select>
      </div>

      <div class="form-group">
        <label>源语言</label>
        <select id="source-lang">
          <option value="en">English</option>
          <option value="auto">自动检测</option>
          <option value="zh-CN">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>

      <div class="form-group">
        <label>目标语言</label>
        <select id="target-lang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>

      <div class="form-group">
        <label>默认显示模式</label>
        <select id="display-mode">
          <option value="bilingual">双语对照（原文 + 译文）</option>
          <option value="translation-only">仅看译文</option>
          <option value="original-only">仅看原文</option>
        </select>
      </div>
    </div>

    <!-- DeepSeek 配置 -->
    <div class="card">
      <div class="card-title">🤖 DeepSeek AI 配置</div>
      <div class="form-group">
        <label>API Key <span class="hint">— 从 platform.deepseek.com 获取</span></label>
        <input type="password" id="deepseek-api-key" placeholder="sk-...">
      </div>
      <p style="font-size:12px;color:#888;margin-top:4px;">
        DeepSeek 提供免费额度，学术翻译质量高于通用翻译引擎。API Key 仅存储在本地浏览器。
      </p>
    </div>

    <!-- OpenAI 配置 -->
    <div class="card">
      <div class="card-title">🤖 OpenAI GPT 配置</div>
      <div class="form-group">
        <label>API Key <span class="hint">— 从 platform.openai.com 获取</span></label>
        <input type="password" id="openai-api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label>API Base URL <span class="hint">— 可填写代理地址或兼容端点</span></label>
        <input type="url" id="openai-base-url" placeholder="https://api.openai.com/v1">
      </div>
      <div class="form-group">
        <label>模型</label>
        <select id="openai-model">
          <option value="gpt-4o-mini">GPT-4o mini（推荐，性价比高）</option>
          <option value="gpt-4o">GPT-4o（更高质量）</option>
          <option value="gpt-4.1">GPT-4.1</option>
        </select>
      </div>
    </div>

    <!-- 缓存管理 -->
    <div class="card">
      <div class="card-title">🗄️ 缓存管理</div>
      <div class="cache-info" id="cache-stats">
        加载中...
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button class="btn btn-danger" id="clear-cache-btn">清除全部翻译缓存</button>
        <button class="btn" id="refresh-stats-btn">刷新统计</button>
      </div>
    </div>

    <!-- 保存 -->
    <div class="btn-row">
      <button class="btn" id="reset-btn">恢复默认设置</button>
      <button class="btn btn-primary" id="save-btn">保存设置</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="options.js"></script>
</body>
</html>
